# =============================================================================
# Python packaging/dependency manifest (PEP 621 format). `pip install .`
# (used by the Dockerfile) reads this file to know what to install; so does
# `pip install -e .` for local development. Every version below is pinned
# exactly (== rather than >=) so a fresh install always resolves the same
# dependency versions the project was actually built and tested against.
# =============================================================================
[project]
name = "courier-app-demo"
version = "0.1.0"
description = "A demo courier shipment and tracking management application."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.140.0",           # web framework: routing, dependency injection, OpenAPI/Swagger
    "email-validator==2.3.0",     # backs Pydantic's EmailStr validation
    "jinja2==3.1.6",               # server-side HTML template rendering
    "psycopg[binary]==3.3.4",     # PostgreSQL database driver
    "pwdlib[argon2]==0.3.0",      # Argon2 password hashing
    "pyjwt==2.13.0",               # signs/verifies the JWT session cookie
    "pydantic-settings==2.14.2",  # loads app/config.py Settings from env vars/.env
    "python-multipart==0.0.32",   # required by FastAPI to parse HTML <form> submissions
    "sqlmodel==0.0.39",             # ORM: combines SQLAlchemy + Pydantic for the domain models
    "uvicorn[standard]==0.51.0",  # ASGI server that actually runs the FastAPI app
]

# Extra dependencies only needed for running the test suite - never
# installed in the production Docker image (see Dockerfile, which only
# installs the base [project] dependencies above).
[dependency-groups]
dev = [
    "httpx2==2.10.0",   # HTTP client used internally by FastAPI's TestClient
    "pytest==9.1.1",
    "pytest-cov==7.1.0",  # coverage reporting (see README's "Generate a coverage report")
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
